name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# iOS 截图 / JVM 探针结果要发到公开 Release（免登录下载 artifact，
# 本地和用户都能直接看）。其余 job 只读。
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux 兼容测试（构建 + X11/Wayland/KWin 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libwayland-dev \
            xvfb imagemagick x11-utils xdotool weston dbus-x11 \
            fonts-noto-cjk adwaita-icon-theme

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 静态分析
        # info 不挡 CI（不同 Flutter 版本 lint 集合在漂移），warning/error 仍然致命。
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      # MINT_TEST_BACKDROP：KWin 探针用（应用启动即应用窗口材质）。
      # 失败时用 verbose 重跑一遍，只留尾部日志定位（ninja 默认吞链接错误详情）。
      - name: 构建 Linux 版本
        run: >
          flutter build linux --release
          --dart-define=MINT_TEST_BACKDROP=acrylic
          || { flutter build linux --release --verbose 2>&1 | tail -250; exit 1; }

      - name: X11 冒烟（Xvfb）
        run: bash tool/ci/smoke_x11.sh build/linux/x64/release/bundle/mint build/smoke/x11

      - name: 多场景截图巡游（页面 / 风格 / 明暗）
        run: bash tool/ci/screenshot_tour.sh build/linux/x64/release/bundle/mint build/smoke/tour

      - name: Wayland 冒烟（weston headless）
        run: bash tool/ci/smoke_wayland.sh build/linux/x64/release/bundle/mint build/smoke/wayland

      # best-effort：Xvfb 里跑真 KWin 验证模糊原子接线。
      # kwin 在无 GL 的虚拟显示上可能开不了混成，但原子设置不需要混成。
      - name: KWin 模糊探针（X11 原子）
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends kwin-x11
          bash tool/ci/kwin_blur_probe.sh build/linux/x64/release/bundle/mint build/smoke/kwin

      - name: 上传冒烟产物（截图 / 日志）
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: build/smoke
          if-no-files-found: warn

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: warn

  windows:
    name: Windows 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: 构建 Windows 版本
        run: flutter build windows --release

  android:
    name: Android 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 编译 Debug APK
        run: flutter build apk --debug

  ios:
    name: iOS 构建 + 模拟器实跑截图
    # macos-26 才带 Xcode 26（iOS 26 模拟器 runtime + UIGlassEffect）；
    # macos-15 及以下是 iOS 18 runtime，玻璃能力探测会如实降级为自绘。
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      # 模拟器只支持 debug 构建（Flutter 不给 simulator 出 release）；
      # 设备版 Release 需要开发者账号，先不配。
      - name: 构建 iOS（模拟器）
        run: flutter build ios --simulator --debug

      - name: 启动模拟器
        id: sim
        run: |
          set -e
          # 诊断：Xcode 版本与可用 runtime（玻璃能力依赖 iOS 26 runtime）。
          xcodebuild -version
          xcrun simctl list runtimes | grep -E "iOS" || true
          # 在可用设备里挑一台 iPhone（不同 Xcode 镜像名字会变，按 UDID 找最稳）。
          UDID=$(xcrun simctl list devices available |
            grep -m1 -E "iPhone" |
            sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "udid=$UDID" >>"$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          # 等模拟器就绪（bootstatus 轮询到不再启动中为止）。
          xcrun simctl bootstatus "$UDID" -b

      - name: 模拟器实跑 + 多场景截图
        shell: bash   # -eo pipefail
        run: |
          set -e
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/ios/iphonesimulator/Runner.app"
          mkdir -p build/shots
          xcrun simctl install "$UDID" "$APP"

          # fu.mtz（MIUI 主题测试素材，126MB 不进仓库）→ 沙盒
          # Documents/import_theme.mtz：应用启动时自动导入并删除（见
          # main.dart 的 iOS 标记文件钩子）。导入 126MB 包要几十秒，
          # 截图轮询自然覆盖。
          DATA=$(xcrun simctl get_app_container "$UDID" dev.mint.mint data)
          mkdir -p "$DATA/Documents"
          curl -sL --retry 3 -o "$DATA/Documents/import_theme.mtz" \
            "https://github.com/memz2345/MintLauncher/releases/download/test-assets/fu.mtz"
          ls -la "$DATA/Documents/import_theme.mtz"

          # 场景配置走沙盒文件（SIMCTL_CHILD_* 在 --console-pty 下不进场，
          # 见 README「iOS」已知限制）。themeMode 每轮显式写，免得深色
          # 场景污染下一轮（settings 会持久化）。
          shot() {
            local name="$1"; local config="${2:-}"
            local cfg="$DATA/Documents/mint_test_config.json"
            if [ -n "$config" ]; then
              printf '%s' "$config" >"$cfg"
            else
              rm -f "$cfg"
            fi
            # 首启可能被 iOS watchdog 杀（首启要导入 126MB 主题包）：进程死了
            # 立即重拉，最多 3 次；第三次后主题已导入完成（prefs 持久化），
            # 重拉是秒起的。
            for attempt in 1 2 3; do
              xcrun simctl launch --console-pty \
                "$UDID" dev.mint.mint >"build/shots/console-$name.log" 2>&1 &
              # launch 输出 "dev.mint.mint: <pid>"，用于存活检查（simulator
              # 内进程对主机可见）。
              sleep 1
              local pid
              pid=$(head -1 "build/shots/console-$name.log" | sed -E 's/.*: *//')
              local ok=0
              for _ in $(seq 1 48); do
                sleep 5
                # 进程死了：立即重拉（不然轮询会被桌面截图骗过 content 判定）。
                if [ -n "$pid" ] && ! ps -p "$pid" >/dev/null 2>&1; then
                  echo "shot $name: attempt $attempt 进程退出（疑似 watchdog），重拉"
                  break
                fi
                xcrun simctl io "$UDID" screenshot "build/shots/ios-$name.png" || true
                # 白屏（只有状态栏）PNG 约 70KB；真实页面（壁纸/内容）>1MB。
                # 200KB 门槛能把「应用还在启动 / 被 watchdog 杀」的假截图挡掉。
                if [ -f "build/shots/ios-$name.png" ] &&
                   [ "$(stat -f%z "build/shots/ios-$name.png")" -gt 200000 ]; then
                  ok=1
                  break
                fi
              done
              if [ "$ok" = 1 ]; then
                # 首帧后再等页面稳定，重截一张；但只在白屏门槛之上才覆盖，
                # 免得「应用刚好在这 6 秒里被 watchdog 杀」把好图冲成 70KB 白屏。
                sleep 6
                local stable="build/shots/ios-$name-stable.png"
                xcrun simctl io "$UDID" screenshot "$stable" || true
                if [ -f "$stable" ] &&
                   [ "$(stat -f%z "$stable")" -gt 200000 ]; then
                  mv "$stable" "build/shots/ios-$name.png"
                fi
                rm -f "$stable"
                break
              fi
              xcrun simctl terminate "$UDID" dev.mint.mint 2>/dev/null || true
              sleep 2
            done
            if [ "$ok" = 0 ]; then
              # 三次都没拿到真实画面：宁可缺这张，也不把白屏当截图发布。
              rm -f "build/shots/ios-$name.png"
              echo "shot $name: 未拿到有效截图（白屏 / 进程被杀）"
            fi
            xcrun simctl terminate "$UDID" dev.mint.mint 2>/dev/null || true
            sleep 2
          }

          shot home '{"themeMode":"light"}'
          shot settings '{"page":"settings","themeMode":"light"}'
          # 长按返回键 → 系统层级菜单（等 3 秒自动弹出，截图时已展开）。
          shot backmenu '{"page":"settings","themeMode":"light","showBackMenu":true}'
          shot downloads '{"page":"downloads","themeMode":"light"}'
          shot dark '{"themeMode":"dark"}'

          # 兜底诊断：应用进程的统一日志（崩溃 / 插件报错在这里）。
          xcrun simctl spawn "$UDID" log show --last 15m \
            --predicate 'process == "Runner"' --style compact \
            > build/shots/unified-log.txt 2>&1 || true

      # 「试一下能不能启动游戏」第一性实验：模拟器的 dlopen 强制校验
      # Mach-O 平台标签，先把 macOS JRE 重打成 ios-simulator + 重签，
      # 再在应用内 dlopen + JNI_CreateJavaVM + 调 System.getProperty
      # 验证「JVM 与 Java 代码」能跑。图形后端（LWJGL/GLFW）是下一环。
      - name: iOS 起 JVM 探针（JRE 平台标签重签）
        run: bash tool/ci/ios_jvm_probe.sh "${{ steps.sim.outputs.udid }}"

      - name: 上传截图与诊断
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/shots
          if-no-files-found: warn

      # artifact 下载要登录；同步发一份到公开 Release，任何浏览器都能看。
      - name: 发布 iOS 截图到公开 Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="ci-ios-shots"
          files=(build/shots/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "(无截图可发布)"; exit 0; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber || true
          else
            gh release create "$tag" --prerelease \
              --title "iOS CI 截图（自动更新）" \
              --notes "由 GitHub Actions 的 iOS 模拟器截图步骤覆盖更新。" \
              "${files[@]}" || true
          fi
          for f in build/shots/jvm_probe_result.txt \
                   build/shots/jvm-console.log \
                   build/shots/jvm-unified-log.txt; do
            if [ -f "$f" ]; then
              gh release upload "$tag" "$f" --clobber || true
            fi
          done

  linux-game:
    name: Linux 游戏启动实测（Xvfb + llvmpipe）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖（Xvfb 供 GLFW 建窗口，llvmpipe 即纯 CPU 渲染路径）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri mesa-utils fonts-noto-cjk

      - name: 拉取 Dart 依赖
        run: flutter pub get

      # e2e：清单 → 安装 1.20.4（库/资源/natives）→ 缺 Java 自动下载
      # Mojang Linux 运行时 → 起游戏进程 → 观察 90 秒。
      # 通过标准：日志里出现 LWJGL Version 且无主类异常 —— 和本地
      # `dart run tool/e2e_launch_test.dart` 同一套判定。
      - name: 端到端游戏启动冒烟
        shell: bash   # -eo pipefail，tee 不吃掉 dart 的退出码
        run: |
          mkdir -p build
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            MINT_E2E_MIRROR=official \
            dart run tool/e2e_launch_test.dart 1.20.4 2>&1 | tee build/e2e_launch.log

      - name: 上传 e2e 日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-game-e2e
          path: |
            build/e2e_launch.log
          if-no-files-found: warn
