name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux 兼容测试（构建 + X11/Wayland/KWin 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libwayland-dev \
            xvfb imagemagick x11-utils xdotool weston dbus-x11 \
            fonts-noto-cjk adwaita-icon-theme

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 静态分析
        # info 不挡 CI（不同 Flutter 版本 lint 集合在漂移），warning/error 仍然致命。
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      # MINT_TEST_BACKDROP：KWin 探针用（应用启动即应用窗口材质）。
      # 失败时用 verbose 重跑一遍，只留尾部日志定位（ninja 默认吞链接错误详情）。
      - name: 构建 Linux 版本
        run: >
          flutter build linux --release
          --dart-define=MINT_TEST_BACKDROP=acrylic
          || { flutter build linux --release --verbose 2>&1 | tail -250; exit 1; }

      - name: X11 冒烟（Xvfb）
        run: bash tool/ci/smoke_x11.sh build/linux/x64/release/bundle/mint build/smoke/x11

      - name: 多场景截图巡游（页面 / 风格 / 明暗）
        run: bash tool/ci/screenshot_tour.sh build/linux/x64/release/bundle/mint build/smoke/tour

      - name: Wayland 冒烟（weston headless）
        run: bash tool/ci/smoke_wayland.sh build/linux/x64/release/bundle/mint build/smoke/wayland

      # best-effort：Xvfb 里跑真 KWin 验证模糊原子接线。
      # kwin 在无 GL 的虚拟显示上可能开不了混成，但原子设置不需要混成。
      - name: KWin 模糊探针（X11 原子）
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends kwin-x11
          bash tool/ci/kwin_blur_probe.sh build/linux/x64/release/bundle/mint build/smoke/kwin

      - name: 上传冒烟产物（截图 / 日志）
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: build/smoke
          if-no-files-found: warn

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: warn

  windows:
    name: Windows 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: 构建 Windows 版本
        run: flutter build windows --release

  android:
    name: Android 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 编译 Debug APK
        run: flutter build apk --debug

  linux-game:
    name: Linux 游戏启动实测（Xvfb + llvmpipe）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖（Xvfb 供 GLFW 建窗口，llvmpipe 即纯 CPU 渲染路径）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri mesa-utils fonts-noto-cjk

      - name: 拉取 Dart 依赖
        run: flutter pub get

      # e2e：清单 → 安装 1.20.4（库/资源/natives）→ 缺 Java 自动下载
      # Mojang Linux 运行时 → 起游戏进程 → 观察 90 秒。
      # 通过标准：日志里出现 LWJGL Version 且无主类异常 —— 和本地
      # `dart run tool/e2e_launch_test.dart` 同一套判定。
      - name: 端到端游戏启动冒烟
        shell: bash   # -eo pipefail，tee 不吃掉 dart 的退出码
        run: |
          mkdir -p build
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            MINT_E2E_MIRROR=official \
            dart run tool/e2e_launch_test.dart 1.20.4 2>&1 | tee build/e2e_launch.log

      - name: 上传 e2e 日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-game-e2e
          path: |
            build/e2e_launch.log
          if-no-files-found: warn
